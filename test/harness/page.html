<!doctype html>
<meta charset="utf-8" />
<title>SignalForge render harness</title>
<body style="margin:0;padding:0;background:#000">
  <canvas id="exCanvas"></canvas>
</body>
<script src="../../dist/engine.bundle.js"></script>
<script>
  const canvas = document.getElementById('exCanvas');
  // The canvas size comes only from the engine's document.js constants —
  // never hardcoded here.
  canvas.width = window.SignalForgeEngine.CANVAS_WIDTH;
  canvas.height = window.SignalForgeEngine.CANVAS_HEIGHT;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  function grab() {
    const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let binary = '';
    const bytes = image.data;
    for (let i = 0; i < bytes.length; i += 1) binary += String.fromCharCode(bytes[i]);
    return { width: canvas.width, height: canvas.height, pixels: btoa(binary) };
  }

  window.__run = async function (job) {
    const { createRenderer, loadAssets, normalizeDocument } = window.SignalForgeEngine;
    const { doc } = normalizeDocument(job.doc);
    const assets = await loadAssets(doc, {
      resolveUrl: (asset) => (asset.data ? `data:${asset.mime};base64,${asset.data}` : asset.file)
    });
    const renderer = createRenderer();
    // Render twice so any lazily built scratch buffers exist for the measured frame.
    renderer.render(ctx, doc, assets, job.timeSec);
    renderer.render(ctx, doc, assets, job.timeSec);
    const result = grab();
    renderer.dispose();
    return result;
  };

  window.__grab = grab;

  /**
   * Read a finished PNG back into pixels, on a canvas of the picture's own
   * size — not the engine's. Used to check what an export actually wrote into
   * a folder, which is the only way to tell a real render from a plausible
   * file that happens to exist.
   */
  window.__decode = function (dataUrl) {
    return new Promise(function (resolve, reject) {
      const image = new Image();
      image.onload = function () {
        const c = document.createElement('canvas');
        c.width = image.naturalWidth;
        c.height = image.naturalHeight;
        const g = c.getContext('2d', { willReadFrequently: true });
        g.drawImage(image, 0, 0);
        const d = g.getImageData(0, 0, c.width, c.height).data;
        let s = '';
        for (let i = 0; i < d.length; i += 1) s += String.fromCharCode(d[i]);
        resolve({ width: c.width, height: c.height, pixels: btoa(s) });
      };
      image.onerror = function () { reject(new Error('the picture could not be decoded')); };
      image.src = dataUrl;
    });
  };
</script>
