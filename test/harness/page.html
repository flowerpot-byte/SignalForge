<!doctype html>
<meta charset="utf-8" />
<title>SignalForge render harness</title>
<body style="margin:0;padding:0;background:#000">
  <canvas id="exCanvas"></canvas>
</body>
<script src="../../dist/engine.bundle.js"></script>
<script>
  const canvas = document.getElementById('exCanvas');
  // The canvas size comes only from the engine's document.js constants —
  // never hardcoded here.
  canvas.width = window.SignalForgeEngine.CANVAS_WIDTH;
  canvas.height = window.SignalForgeEngine.CANVAS_HEIGHT;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  function grab() {
    const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let binary = '';
    const bytes = image.data;
    for (let i = 0; i < bytes.length; i += 1) binary += String.fromCharCode(bytes[i]);
    return { width: canvas.width, height: canvas.height, pixels: btoa(binary) };
  }

  const resolveUrl = (asset) => (asset.data ? `data:${asset.mime};base64,${asset.data}` : asset.file);

  /**
   * The frame as two numbers, for a run too long to hand back whole.
   *
   * A thousand frames of pixels is a quarter of a gigabyte of base64; a
   * thousand frames of "how bright is the brightest thing left" is what the
   * questions about a trail are actually made of — has the wake faded away, is
   * it still fading, has it settled.
   */
  function measure() {
    const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let max = 0;
    let sum = 0;
    for (let i = 0; i < d.length; i += 4) {
      const v = Math.max(d[i], d[i + 1], d[i + 2]);
      if (v > max) max = v;
      sum += d[i] + d[i + 1] + d[i + 2];
    }
    return { max, mean: sum / (3 * canvas.width * canvas.height) };
  }

  window.__run = async function (job) {
    const { createRenderer, loadAssets, normalizeDocument } = window.SignalForgeEngine;
    const { doc } = normalizeDocument(job.doc);
    const assets = await loadAssets(doc, { resolveUrl });
    const renderer = createRenderer();

    /**
     * `frames`: a whole SEQUENCE on one renderer and one canvas, in order.
     *
     * This is the only way to ask a trailing document anything at all. Without
     * a trail a frame is a function of (document, assets, time) and one render
     * answers everything; with one, frame N is composited over frame N-1, so
     * what a document looks like at a given second depends on every second
     * before it (see createRenderer in src/engine/engine.js).
     *
     * An entry is either a plain number — the second to render at — or an
     * object that may also carry a `doc` to switch to from that frame onwards.
     * Switching is what makes "what is LEFT of the picture once it stops being
     * drawn" a measurable thing rather than an argument.
     *
     * Rendered exactly ONCE per entry, unlike the single-frame path below
     * which renders twice to warm up lazily built scratch buffers. Twice here
     * would lay the veil down twice per frame and measure a sequence nothing
     * ever runs. It is also the more faithful comparison: the exported effect
     * draws each frame once from cold too.
     */
    if (Array.isArray(job.frames)) {
      let current = doc;
      let currentAssets = assets;
      const trace = [];
      for (const entry of job.frames) {
        const step = typeof entry === 'number' ? { timeSec: entry } : entry;
        if (step.doc) {
          current = normalizeDocument(step.doc).doc;
          currentAssets = await loadAssets(current, { resolveUrl });
        }
        renderer.render(ctx, current, currentAssets, step.timeSec);
        if (job.trace) trace.push(measure());
      }
      const sequence = grab();
      renderer.dispose();
      return job.trace ? Object.assign(sequence, { trace }) : sequence;
    }

    // `before`: documents drawn on THIS renderer first, so what is measured
    // afterwards is what a live app shows rather than what a cold start shows.
    // Every layer keeps its scratch state for as long as its id exists (see
    // stateFor in src/engine/engine.js), so a cache built while drawing one of
    // these is still there for the frame that is kept — which is the only way
    // to catch a cache that hands back a stale picture after a setting moved.
    // Without it every job here begins from an empty cache, the one state
    // nobody using the app is ever in.
    for (const earlier of job.before || []) {
      const prior = normalizeDocument(earlier.doc).doc;
      const priorAssets = await loadAssets(prior, { resolveUrl });
      renderer.render(ctx, prior, priorAssets, earlier.timeSec || 0);
    }

    // Render twice so any lazily built scratch buffers exist for the measured frame.
    renderer.render(ctx, doc, assets, job.timeSec);
    renderer.render(ctx, doc, assets, job.timeSec);
    const result = grab();
    renderer.dispose();
    return result;
  };

  window.__grab = grab;

  /**
   * Read a finished PNG back into pixels, on a canvas of the picture's own
   * size — not the engine's. Used to check what an export actually wrote into
   * a folder, which is the only way to tell a real render from a plausible
   * file that happens to exist.
   */
  window.__decode = function (dataUrl) {
    return new Promise(function (resolve, reject) {
      const image = new Image();
      image.onload = function () {
        const c = document.createElement('canvas');
        c.width = image.naturalWidth;
        c.height = image.naturalHeight;
        const g = c.getContext('2d', { willReadFrequently: true });
        g.drawImage(image, 0, 0);
        const d = g.getImageData(0, 0, c.width, c.height).data;
        let s = '';
        for (let i = 0; i < d.length; i += 1) s += String.fromCharCode(d[i]);
        resolve({ width: c.width, height: c.height, pixels: btoa(s) });
      };
      image.onerror = function () { reject(new Error('the picture could not be decoded')); };
      image.src = dataUrl;
    });
  };
</script>
